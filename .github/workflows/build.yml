name: Compilar ejecutable Windows

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta de la release existente a la que adjuntar el exe (ej. v1.0.1)'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar PyInstaller
        run: pip install pyinstaller

      - name: Generar icono
        run: python assets/make_icon.py

      - name: Compilar TeknoISO.exe
        run: pyinstaller TeknoISO.spec

      - name: Empaquetar
        run: Compress-Archive -Path dist/TeknoISO.exe -DestinationPath TeknoISO-windows-x64.zip

      - name: Publicar artefacto (rama main)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: TeknoISO-windows-x64
          path: TeknoISO-windows-x64.zip

      - name: Adjuntar a la Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: TeknoISO-windows-x64.zip
          tag_name: ${{ inputs.tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
